<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 812 137" width="812" height="137">
  <defs>
    <linearGradient id="techBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- Brand Icon Badge -->
  <g transform="translate(10, 10)">
    <!-- Rounded Shield Background -->
    <rect x="0" y="0" width="117" height="117" rx="24" fill="url(#techBlueGrad)" />
    
    <!-- Stylized Geometric Fleet / Transport Icon -->
    <!-- Truck Cabin & Forward Chevron -->
    <path d="M 28 38 L 68 38 C 72 38 75 41 75 45 L 75 75 C 75 79 72 82 68 82 L 28 82 C 24 82 21 79 21 75 L 21 45 C 21 41 24 38 28 38 Z" fill="#ffffff" opacity="0.95"/>
    <!-- Cab windshield & grill -->
    <path d="M 75 50 L 92 50 C 95 50 97 53 96 56 L 91 75 C 90 79 87 82 83 82 L 75 82 Z" fill="#ffffff" opacity="0.95"/>
    <path d="M 75 54 L 88 54 L 84 68 L 75 68 Z" fill="#0284c7"/>
    
    <!-- Wheels -->
    <circle cx="40" cy="85" r="10" fill="#0f172a"/>
    <circle cx="40" cy="85" r="5" fill="#38bdf8"/>
    <circle cx="78" cy="85" r="10" fill="#0f172a"/>
    <circle cx="78" cy="85" r="5" fill="#38bdf8"/>
    
    <!-- Dynamic Forward Speed Lines -->
    <path d="M 28 47 L 58 47" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M 28 57 L 65 57" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
    <path d="M 28 67 L 54 67" stroke="#0284c7" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Typography: TECHNOFAY -->
  <text x="150" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="58" font-weight="900" letter-spacing="2" fill="#0284c7">
    TECHNOFAY
  </text>

  <!-- Subtitle: TRANSPORT & LOGISTICS -->
  <text x="153" y="105" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="6" fill="#64748b">
    TRANSPORT &amp; LOGISTICS
  </text>
  
  <!-- Sleek separator line -->
  <rect x="152" y="83" width="560" height="3" rx="1.5" fill="url(#accentGrad)" opacity="0.8"/>
</svg>
